name: Build Release Zip
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  buildAndUploadModule:
    name: Build and Upload module
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: '10.x.x'
        
    - name: Install dependencies
      run: dotnet restore

    - name: Update XML File with version from GitHub
      run: |
         pwsh -Command '
           [xml]$xml = Get-Content "./Module/powershellYK.csproj"
           Write-Host $xml.Project.PropertyGroup[0].AssemblyVersion 
           $xml.Project.PropertyGroup[0].AssemblyVersion = ("${{ github.event.release.tag_name }}" -replace "^r", "")
           Write-Host $xml.Project.PropertyGroup[0].AssemblyVersion 
           $xml.Save("./Module/powershellYK.csproj")
         '

    - name: Install platyPS
      run: |
         pwsh -Command '
           install-module -name Microsoft.PowerShell.PlatyPS -Force
         '
         
    - name: Build
      run: dotnet build --no-restore -c Release Module/powershellYK.csproj -p:TargetFramework=net10.0 --output release

    - name: Replace version in the module file
      run: |
          sed -i "s/ModuleVersion.*/ModuleVersion = '${{ github.event.release.tag_name }}'/" release/powershellYK.psd1

    - name: Build MAML XML Help
      run: |
         pwsh -Command '
           Measure-PlatyPSMarkdown -Path ./Docs/Commands/*.md |
             Where-Object Filetype -match 'CommandHelp' |
             Import-MarkdownCommandHelp -Path {$_.FilePath} |
             Export-MamlCommandHelp -OutputFolder ./release 
           New-Item -Type Directory ./release/en-US
           Move-Item ./release/powershellYK/powershellYK.dll-Help.xml ./release/en-US
           Remove-Item ./release/powershellYK
         '

    - name: Zip release folder
      working-directory: release
      run: zip -r ../release.zip *
      
    - name: Upload Release Assets
      id: upload-release-asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: release.zip
        asset_name: powershellYK_${{ github.event.release.tag_name }}.zip
        asset_content_type: application/zip